<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RM calculator & 3+1 logboek</title>
    
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="icon" type="image/png" href="icon.png">

    <style>
        :root {
            /* Basis Tonal Midnight Slate Schema */
            --bg-color: #0B1120;         
            --card-bg: #1E293B;          
            --text-color: #F8FAFC;       
            --text-muted: #94A3B8;       
            --border-color: #334155;     
        }

        /* Dynamische Tonaal Thema Kleuren per Tabblad */
        body.theme-calc {
            --accent-color: #00E1D9;     
            --werkset-bg: rgba(0, 225, 217, 0.08);
            --deload-border: #00E1D9;
            --deload-color: rgba(0, 225, 217, 0.05);
        }
        body.theme-bw {
            --accent-color: #38BDF8;     
            --werkset-bg: rgba(56, 189, 248, 0.08);
            --deload-border: #38BDF8;
            --deload-color: rgba(56, 189, 248, 0.05);
        }
        body.theme-log {
            --accent-color: #A7F3D0;     
            --werkset-bg: rgba(167, 243, 208, 0.08);
            --deload-border: #A7F3D0;
            --deload-color: rgba(167, 243, 208, 0.05);
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            padding: 16px; 
            max-width: 450px; 
            margin: auto; 
            background-color: var(--bg-color);
            color: var(--text-color);
            -webkit-font-smoothing: antialiased;
            transition: all 0.3s ease; 
        }

        .welcome-header {
            text-align: center;
            padding: 24px 10px;
            background: linear-gradient(135deg, #1A2234 0%, #0B1120 100%);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            margin-bottom: 20px;
        }

        .welcome-header h1 {
            font-size: 1.8em;
            margin: 0;
            background: linear-gradient(135deg, #00E1D9 0%, #38BDF8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .welcome-header p {
            font-size: 0.85em;
            color: var(--text-muted);
            margin: 6px 0 0 0;
            font-weight: 500;
        }

        /* Tabs Styling */
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px 4px;
            background: var(--card-bg);
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            font-size: 0.8em;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background: var(--accent-color);
            color: #0F172A; 
            border-color: var(--accent-color);
        }

        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
        }

        h2, h3 { margin-top: 0; color: #fff; font-weight: 700; letter-spacing: -0.3px; }
        
        label { 
            display: block; 
            margin-top: 15px; 
            font-weight: 700; 
            font-size: 0.75em; 
            color: var(--text-muted);
            letter-spacing: 0.8px;
        }

        input, select { 
            width: 100%; 
            padding: 14px; 
            margin-top: 8px; 
            border: 1px solid var(--border-color); 
            border-radius: 10px; 
            box-sizing: border-box; 
            font-size: 1em;
            font-weight: 600;
            background-color: #0F172A; 
            color: #fff;
            appearance: none;
            transition: border-color 0.3s ease;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .resultaat { 
            background-color: #0F172A; 
            border-left: 4px solid var(--accent-color); 
            padding: 16px; 
            margin-top: 20px; 
            border-radius: 10px;
            font-size: 0.95em;
            line-height: 1.5;
            transition: border-left-color 0.3s ease;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            text-align: left;
            padding: 14px 8px;
            border-bottom: 1px solid var(--border-color);
        }

        th { font-size: 0.75em; color: var(--text-muted); font-weight: 700; letter-spacing: 0.5px; }
        
        .werkset { font-weight: bold; background-color: var(--werkset-bg); color: var(--accent-color); transition: all 0.3s ease; }
        .techniekset { color: var(--text-muted); font-style: italic; }

        /* Logboek Specifieke Styling */
        .logboek-card {
            padding: 16px; 
            margin-top: 12px; 
            border-radius: 12px; 
            background-color: #0F172A; 
            border: 1px solid var(--border-color);
        }
        .logboek-card.deload {
            background-color: var(--deload-color); 
            border: 1px solid var(--deload-border);
            border-left: 4px solid var(--deload-border);
        }
        .btn-save {
            background: var(--accent-color); 
            color: #0F172A; 
            border: none; 
            padding: 0 16px; 
            border-radius: 10px; 
            font-weight: 800; 
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn-save:hover { opacity: 0.8; }
        
        .btn-calc {
            margin-top: 12px; 
            width: 100%; 
            background: var(--werkset-bg); 
            color: var(--accent-color); 
            border: 1px solid var(--accent-color); 
            padding: 12px; 
            border-radius: 10px; 
            font-weight: 700; 
            cursor: pointer;
            transition: all 0.3s ease;
        }
    </style>
</head>
<body class="theme-calc">

    <div class="welcome-header">
        <h1>RM calculator</h1>
        <p id="begroeting">Klaar voor je volgende workout!</p>
    </div>

    <div class="tabs">
        <button id="btn-tab-calc" class="tab-btn active" onclick="switchTab('calc')">🏋️ Gewichten</button>
        <button id="btn-tab-bw" class="tab-btn" onclick="switchTab('bw')">🤸 Bodyweight</button>
        <button id="btn-tab-log" class="tab-btn" onclick="switchTab('log')">📖 Logboek</button>
    </div>

    <div id="tab-calc">
        <div class="card">
            <h2>Kracht oefeningen</h2>

            <label for="oefening">Kies oefening:</label>
            <select id="oefening" onchange="laadGegevens(); updateStijlOpties(); syncLogboekOefening();">
                <option value="Squat">Squat</option>
                <option value="Bench Press">Bench press (barbell)</option>
                <option value="Dumbbell Press">Dumbbell bench press</option>
                <option value="Deadlift">Deadlift</option>
                <option value="Overhead Press">Overhead press</option>
                <option value="Powerclean">Powerclean</option>
                <option value="RDL">RDL (romanian deadlift)</option>
            </select>
            
            <label for="doelType">Doel van vandaag:</label>
            <select id="doelType" onchange="updateStijlOpties()">
                <option value="1">1RM (absolute max - PR test)</option>
                <option value="3">3RM (maximale kracht & power)</option>
                <option value="5" selected>5RM (pure kracht & dichte spiermassa)</option>
                <option value="6">6RM (hypertrofie - spiergroei)</option>
                <option value="8">8RM (volume - pomp & uithoudingsvermogen)</option>
            </select>

            <label for="warmupStijl">Warming-up stijl:</label>
            <select id="warmupStijl" onchange="bereken()">
            </select>

            <label for="oneRM" id="oneRMLabel">Jouw 1RM (kg):</label>
            <input type="text" inputmode="decimal" id="oneRM" placeholder="Bijv. 100" oninput="bereken(); slaOp();">

            <div id="uitkomst" class="resultaat" style="display:none;"></div>
        </div>

        <div class="card" id="warmingup-kaart" style="display:none;">
            <h3 id="schemaTitel">Warming-up schema</h3>
            <p style="font-size: 0.8em; color: var(--text-muted); margin-bottom: 15px;">
                Gewichten automatisch afgerond op 2.5 kg:
            </p>
            
            <table>
                <thead>
                    <tr>
                        <th>Set</th>
                        <th>Gewicht</th>
                        <th>Reps</th>
                    </tr>
                </thead>
                <tbody id="warmup-tabel">
                </tbody>
            </table>
        </div>
    </div>

    <div id="tab-bw" style="display:none;">
        <div class="card">
            <h2>Bodyweight oefeningen</h2>

            <label for="bwOefening">Kies oefening:</label>
            <select id="bwOefening" onchange="laadGegevensBw(); syncLogboekBw();">
                <option value="Pull-ups">Pull-ups (rug/biceps)</option>
                <option value="Push-ups">Push-ups (borst/triceps)</option>
                <option value="Dips">Dips (borst/triceps)</option>
            </select>

            <label for="bwMethode">Kies trainingsmethode:</label>
            <select id="bwMethode" onchange="updateBwOpties(); slaOpBw();">
                <option value="dup" selected>DUP (2x per week variëren)</option>
                <option value="emom">EMOM (10 min. volume & uithoudingsvermogen)</option>
                <option value="klassiek">Klassiek (3 zware sets voor spiergroei)</option>
            </select>
            
            <div id="bwSessieContainer">
                <label for="bwSessie">Trainingsdag (bij DUP methode):</label>
                <select id="bwSessie" onchange="berekenBw()">
                    <option value="volume">Sessie A: volume (spieropbouw)</option>
                    <option value="intensiteit">Sessie B: intensiteit (kracht & PR testen)</option>
                </select>
            </div>

            <label for="bwMax">Jouw max reps (in 1 onafgebroken set):</label>
            <input type="number" inputmode="numeric" id="bwMax" placeholder="Bijv. 10" oninput="berekenBw(); slaOpBw();">

            <div id="bwUitkomst" class="resultaat" style="display:none;"></div>
        </div>

        <div class="card" id="bw-kaart" style="display:none;">
            <h3 id="bwTitel">Rep schema</h3>
            <p style="font-size: 0.8em; color: var(--text-muted); margin-bottom: 15px;">
                Neem 1.5 tot 2 minuten rust tussen elke set.
            </p>
            
            <table>
                <thead>
                    <tr>
                        <th>Set</th>
                        <th>Type</th>
                        <th>Doel</th>
                    </tr>
                </thead>
                <tbody id="bw-tabel">
                </tbody>
            </table>
        </div>
    </div>

    <div id="tab-log" style="display:none;">
        <div class="card">
            <h2>3+1 cyclus logboek</h2>
            <p style="font-size: 0.85em; color: var(--text-muted); margin-bottom: 15px;">Bouw 3 weken op, herstel in week 4.</p>
            
            <label for="logboekOefening">Kies oefening:</label>
            <select id="logboekOefening" onchange="renderLogboek(); syncFromLogboek();">
                <optgroup label="Gewichten">
                    <option value="Squat">Squat</option>
                    <option value="Bench Press">Bench press (barbell)</option>
                    <option value="Dumbbell Press">Dumbbell bench press</option>
                    <option value="Deadlift">Deadlift</option>
                    <option value="Overhead Press">Overhead press</option>
                    <option value="Powerclean">Powerclean</option>
                    <option value="RDL">RDL (romanian deadlift)</option>
                </optgroup>
                <optgroup label="Bodyweight">
                    <option value="Pull-ups">Pull-ups</option>
                    <option value="Push-ups">Push-ups</option>
                    <option value="Dips">Dips</option>
                </optgroup>
            </select>

            <div id="logboek-doel-container">
                <label for="logboekDoel">Trainingsdoel voor dit blok:</label>
                <select id="logboekDoel" onchange="slaLogboekDoelOp()">
                    <option value="1">1RM (absolute max - PR test)</option>
                    <option value="3">3RM (maximale kracht & power)</option>
                    <option value="5" selected>5RM (pure kracht & dichte spiermassa)</option>
                    <option value="6">6RM (hypertrofie - spiergroei)</option>
                    <option value="8">8RM (volume - pomp & uithoudingsvermogen)</option>
                </select>
            </div>

            <div id="logboek-content" style="margin-top: 20px;">
                </div>
        </div>
    </div>

    <script>
        let logboekData = {};
        const bwOefeningen = ["Pull-ups", "Push-ups", "Dips"];

        window.onload = function() {
            stelBegroetingIn();
            laadGegevens();
            laadGegevensBw();
            updateStijlOpties();
            initLogboek();
        };

        // --- TABBLADEN LOGICA ---
        function switchTab(tabName) {
            document.body.className = 'theme-' + tabName;

            document.getElementById('tab-calc').style.display = (tabName === 'calc') ? 'block' : 'none';
            document.getElementById('tab-bw').style.display = (tabName === 'bw') ? 'block' : 'none';
            document.getElementById('tab-log').style.display = (tabName === 'log') ? 'block' : 'none';
            
            document.getElementById('btn-tab-calc').classList.toggle('active', tabName === 'calc');
            document.getElementById('btn-tab-bw').classList.toggle('active', tabName === 'bw');
            document.getElementById('btn-tab-log').classList.toggle('active', tabName === 'log');

            if (tabName === 'log') {
                renderLogboek();
            }
        }

        // --- SYNCHRONISATIE TUSSEN TABS ---
        function syncLogboekOefening() {
            document.getElementById('logboekOefening').value = document.getElementById('oefening').value;
        }

        function syncLogboekBw() {
            document.getElementById('logboekOefening').value = document.getElementById('bwOefening').value;
        }

        function syncFromLogboek() {
            const oefening = document.getElementById('logboekOefening').value;
            if (bwOefeningen.includes(oefening)) {
                document.getElementById('bwOefening').value = oefening;
                laadGegevensBw();
            } else {
                document.getElementById('oefening').value = oefening;
                laadGegevens();
            }
        }

        function laadInCalculator(waarde, oefening, doel) {
            if (bwOefeningen.includes(oefening)) {
                document.getElementById('bwOefening').value = oefening;
                document.getElementById('logboekOefening').value = oefening;
                document.getElementById('bwMax').value = waarde;
                switchTab('bw');
                berekenBw();
            } else {
                document.getElementById('oefening').value = oefening;
                document.getElementById('logboekOefening').value = oefening;
                if (doel) {
                    document.getElementById('doelType').value = doel;
                }
                document.getElementById('oneRM').value = waarde;
                switchTab('calc');
                updateStijlOpties();
            }
        }

        // --- BODYWEIGHT LOGICA ---
        function updateBwOpties() {
            const methode = document.getElementById('bwMethode').value;
            const sessieContainer = document.getElementById('bwSessieContainer');
            if (methode === 'dup') {
                sessieContainer.style.display = 'block';
            } else {
                sessieContainer.style.display = 'none';
            }
            berekenBw();
        }

        function slaOpBw() {
            try {
                const oefening = document.getElementById('bwOefening').value;
                const reps = document.getElementById('bwMax').value;
                const methode = document.getElementById('bwMethode').value;
                localStorage.setItem('bw_max_' + oefening, reps);
                localStorage.setItem('bw_methode_' + oefening, methode);
            } catch (e) {}
        }

        function laadGegevensBw() {
            const oefening = document.getElementById('bwOefening').value;
            try {
                const opgeslagenReps = localStorage.getItem('bw_max_' + oefening);
                const opgeslagenMethode = localStorage.getItem('bw_methode_' + oefening);
                
                if (opgeslagenReps) {
                    document.getElementById('bwMax').value = opgeslagenReps;
                } else {
                    document.getElementById('bwMax').value = '';
                }

                if (opgeslagenMethode) {
                    document.getElementById('bwMethode').value = opgeslagenMethode;
                } else {
                    document.getElementById('bwMethode').value = 'dup';
                }
            } catch (e) {}
            updateBwOpties();
        }

        function berekenBw() {
            const oefening = document.getElementById('bwOefening').value;
            const sessie = document.getElementById('bwSessie').value;
            const methode = document.getElementById('bwMethode').value;
            const invoer = document.getElementById('bwMax').value;
            const maxReps = parseInt(invoer);

            const uitkomstDiv = document.getElementById('bwUitkomst');
            const bwKaart = document.getElementById('bw-kaart');
            const bwTabel = document.getElementById('bw-tabel');
            const bwTitel = document.getElementById('bwTitel');

            if (maxReps > 0) {
                uitkomstDiv.style.display = 'block';
                bwKaart.style.display = 'block';

                uitkomstDiv.innerHTML = `
                    Oefening: <strong style="color:var(--accent-color);">${oefening}</strong><br>
                    Jouw max (basis): <strong>${maxReps} reps</strong>
                `;
                bwTitel.innerText = `Schema: ${oefening}`;

                let html = "";
                
                if (methode === "dup") {
                    if (sessie === "volume") {
                        let targetReps = Math.max(1, Math.round(maxReps * 0.70));
                        for (let i = 1; i <= 4; i++) {
                            html += `
                                <tr>
                                    <td>Set ${i}</td>
                                    <td>Werkset (70%)</td>
                                    <td><strong>${targetReps} reps</strong></td>
                                </tr>
                            `;
                        }
                    } else {
                        let targetReps = Math.max(1, Math.round(maxReps * 0.85));
                        for (let i = 1; i <= 3; i++) {
                            html += `
                                <tr>
                                    <td>Set ${i}</td>
                                    <td>Werkset (85%)</td>
                                    <td><strong>${targetReps} reps</strong></td>
                                </tr>
                            `;
                        }
                        html += `
                            <tr class="werkset">
                                <td>Set 4</td>
                                <td>🔥 AMRAP (tot falen)</td>
                                <td><strong>Max reps!</strong></td>
                            </tr>
                        `;
                    }
                } else if (methode === "emom") {
                    let emomReps = Math.max(1, Math.round(maxReps * 0.35));
                    for (let i = 1; i <= 10; i++) {
                        html += `
                            <tr>
                                <td>Minuut ${i}</td>
                                <td>EMOM (start elke minuut)</td>
                                <td><strong>${emomReps} reps</strong></td>
                            </tr>
                        `;
                    }
                } else if (methode === "klassiek") {
                    let targetReps = Math.max(1, Math.round(maxReps * 0.85));
                    for (let i = 1; i <= 2; i++) {
                        html += `
                            <tr>
                                <td>Set ${i}</td>
                                <td>Werkset (RIR 1 - nét niet falen)</td>
                                <td><strong>${targetReps} reps</strong></td>
                            </tr>
                        `;
                    }
                    html += `
                        <tr class="werkset">
                            <td>Set 3</td>
                            <td>🔥 AMRAP (tot falen)</td>
                            <td><strong>Max reps!</strong></td>
                        </tr>
                    `;
                }

                bwTabel.innerHTML = html;
            } else {
                uitkomstDiv.style.display = 'none';
                bwKaart.style.display = 'none';
            }
        }


        // --- LOGBOEK LOGICA ---
        function initLogboek() {
            try {
                const data = localStorage.getItem('ironbase_logboek');
                if (data) logboekData = JSON.parse(data);
            } catch(e) {}
        }

        function slaLogboekOp() {
            try {
                localStorage.setItem('ironbase_logboek', JSON.stringify(logboekData));
            } catch(e) {}
        }

        function slaLogboekDoelOp() {
            const oefening = document.getElementById('logboekOefening').value;
            if (!logboekData[oefening]) {
                logboekData[oefening] = { current: {w1:'', w2:'', w3:'', w4:'', doel: '5'}, history: [] };
            }
            logboekData[oefening].current.doel = document.getElementById('logboekDoel').value;
            slaLogboekOp();
        }

        function saveWeek(weekKey, oefening) {
            if (!logboekData[oefening]) {
                logboekData[oefening] = { current: {w1:'', w2:'', w3:'', w4:'', doel: '5'}, history: [] };
            }
            let inputVal = document.getElementById('input_' + weekKey).value.replace(',', '.');
            logboekData[oefening].current[weekKey] = inputVal;
            slaLogboekOp();
            renderLogboek(); 
        }

        function finishBlock(oefening) {
            if (!logboekData[oefening]) return;
            const current = logboekData[oefening].current;
            
            if (current.w1 || current.w2 || current.w3 || current.w4) {
                logboekData[oefening].history.push({...current}); 
                logboekData[oefening].current = {w1:'', w2:'', w3:'', w4:'', doel: current.doel || '5'};
                slaLogboekOp();
                renderLogboek();
            } else {
                alert("Vul eerst gewichten/reps in voordat je het blok afrondt.");
            }
        }

        function renderLogboek() {
            const oefening = document.getElementById('logboekOefening').value;
            const isBw = bwOefeningen.includes(oefening);
            const unit = isBw ? "reps" : "kg";

            const doelContainer = document.getElementById('logboek-doel-container');
            if (isBw) {
                doelContainer.style.display = 'none';
            } else {
                doelContainer.style.display = 'block';
            }

            if (!logboekData[oefening]) {
                logboekData[oefening] = { current: {w1:'', w2:'', w3:'', w4:'', doel: '5'}, history: [] };
            }
            if (!logboekData[oefening].current.doel) {
                logboekData[oefening].current.doel = '5';
            }

            const current = logboekData[oefening].current;
            const history = logboekData[oefening].history;

            if (!isBw) {
                document.getElementById('logboekDoel').value = current.doel;
            }

            let w1Val = parseFloat(current.w1) || 0;
            let sugW2 = "", sugW3 = "", sugW4 = "";
            
            if (w1Val > 0) {
                if (isBw) {
                    sugW2 = Math.round(w1Val + 1);
                    sugW3 = Math.round(w1Val + 2);
                    let w3Val = parseFloat(current.w3) || sugW3 || 0;
                    sugW4 = w3Val > 0 ? Math.max(1, Math.round(w3Val * 0.65)) : "";
                } else {
                    sugW2 = rondAf2_5(w1Val * 1.025);
                    sugW3 = rondAf2_5(w1Val * 1.050);
                    let w3Val = parseFloat(current.w3) || parseFloat(sugW3) || 0;
                    sugW4 = w3Val > 0 ? rondAf2_5(w3Val * 0.65) : "";
                }
            }

            let html = `<h3>Huidig blok (${oefening})</h3>`;
            html += createWeekRow('Week 1 (opbouw)', 'w1', current.w1, oefening, `Start (${unit})`, false, current.doel);
            html += createWeekRow('Week 2 (zwaarder)', 'w2', current.w2, oefening, sugW2 ? `Advies: ${sugW2} ${unit}` : `Doel (${unit})`, false, current.doel);
            html += createWeekRow('Week 3 (piek)', 'w3', current.w3, oefening, sugW3 ? `Advies: ${sugW3} ${unit}` : `Doel (${unit})`, false, current.doel);
            html += createWeekRow('Week 4 (deload)', 'w4', current.w4, oefening, sugW4 ? `Advies: ${sugW4} ${unit}` : `Doel (${unit})`, true, current.doel);

            html += `<button onclick="finishBlock('${oefening}')" style="width:100%; padding:14px; margin-top:15px; background:var(--accent-color); border:none; border-radius:10px; color:#0F172A; font-weight:800; cursor:pointer;">Blok afronden & opslaan</button>`;

            if (history.length > 0) {
                html += `<h3 style="margin-top:30px;">Historie (${oefening})</h3>`;
                history.slice().reverse().forEach((blok, index) => { 
                    let realIndex = history.length - index;
                    let blokDoelTitel = (!isBw && blok.doel) ? `(${blok.doel}RM)` : '';
                    
                    html += `<div class="resultaat" style="margin-top:12px; font-size:0.85em;">
                        <strong style="color:var(--accent-color);">Blok ${realIndex} ${blokDoelTitel}</strong><br>
                        <span style="color:var(--text-muted);">W1:</span> ${blok.w1 || '-'} ${unit} | 
                        <span style="color:var(--text-muted);">W2:</span> ${blok.w2 || '-'} ${unit} | 
                        <span style="color:var(--text-muted);">W3:</span> ${blok.w3 || '-'} ${unit} | 
                        <span style="color:var(--text-muted);">W4:</span> ${blok.w4 || '-'} ${unit}
                    </div>`;
                });
            }
            document.getElementById('logboek-content').innerHTML = html;
        }

        function createWeekRow(title, weekKey, value, oefening, placeholder, isDeload = false, doel = '5') {
            let cssClass = isDeload ? 'logboek-card deload' : 'logboek-card';
            
            return `
                <div class="${cssClass}">
                    <strong>${title}</strong>
                    <div style="display:flex; gap:10px; margin-top:10px;">
                        <input type="text" inputmode="decimal" id="input_${weekKey}" value="${value}" placeholder="${placeholder}" style="flex:1; margin-top:0;">
                        <button onclick="saveWeek('${weekKey}', '${oefening}')" class="btn-save">Opslaan</button>
                    </div>
                    ${value ? `<button onclick="laadInCalculator('${value}', '${oefening}', '${doel}')" class="btn-calc">Genereer schema 🚀</button>` : ''}
                </div>
            `;
        }

        // --- CALCULATOR LOGICA (GEWICHTEN) ---
        function stelBegroetingIn() {
            const nu = new Date();
            const uur = nu.getHours();
            const minuut = nu.getMinutes();
            const totaalMinuten = uur * 60 + minuut;

            let tekst = "";
            if (totaalMinuten < 12 * 60) {
                tekst = "Goedemorgen!Start de dag met een gym sessie. 🌅";
            } else if (totaalMinuten >= 12 * 60 && totaalMinuten < 17 * 60 + 30) {
                tekst = "Goedemiddag! Tijd voor een gym sessie. ⚡";
            } else {
                tekst = "Goedenavond! Sluit je dag af in de gym. 🌙";
            }
            document.getElementById('begroeting').innerText = tekst;
        }

        function updateStijlOpties() {
            const doelType = document.getElementById('doelType').value;
            const stijlSelect = document.getElementById('warmupStijl');
            const huidigeKeuze = stijlSelect.value;
            
            stijlSelect.innerHTML = ''; 

            if (doelType === "5" || doelType === "6" || doelType === "8") {
                stijlSelect.innerHTML = `
                    <option value="uitgebreid">Uitgebreid (standaard)</option>
                    <option value="snel">Snel (korte sessie)</option>
                `;
                if (huidigeKeuze === "snel") {
                    stijlSelect.value = "snel";
                } else {
                    stijlSelect.value = "uitgebreid";
                }
            } else {
                stijlSelect.innerHTML = `
                    <option value="uitgebreid" selected>Uitgebreid (verplicht bij 1RM/3RM)</option>
                `;
            }
            
            bereken();
        }

        function rondAf2_5(gewicht) {
            return (Math.round(gewicht / 2.5) * 2.5).toFixed(1).replace('.0', '');
        }

        function formatGewicht(gewicht, isDumbbell) {
            const afgerond = rondAf2_5(gewicht);
            return isDumbbell ? `2x ${afgerond} kg` : `${afgerond} kg`;
        }

        function slaOp() {
            try {
                const oefening = document.getElementById('oefening').value;
                const gewicht = document.getElementById('oneRM').value;
                localStorage.setItem('1rm_' + oefening, gewicht);
            } catch (e) {}
        }

        function laadGegevens() {
            const oefening = document.getElementById('oefening').value;
            const isDumbbell = oefening === "Dumbbell Press";
            
            document.getElementById('oneRMLabel').innerText = isDumbbell 
                ? "Jouw 1RM per dumbbell (kg):" 
                : "Jouw 1RM (kg):";

            try {
                const opgeslagenGewicht = localStorage.getItem('1rm_' + oefening);
                if (opgeslagenGewicht) {
                    document.getElementById('oneRM').value = opgeslagenGewicht;
                } else {
                    document.getElementById('oneRM').value = '';
                }
            } catch (e) {}
        }

        function bereken() {
            const oefening = document.getElementById('oefening').value;
            const isDumbbell = oefening === "Dumbbell Press";
            const doelType = document.getElementById('doelType').value;
            
            const stijlSelect = document.getElementById('warmupStijl');
            const warmupStijl = stijlSelect ? stijlSelect.value : "uitgebreid";
            
            let ruweInvoer = document.getElementById('oneRM').value.replace(',', '.');
            const oneRM = parseFloat(ruweInvoer);
            
            const uitkomstDiv = document.getElementById('uitkomst');
            const warmupKaart = document.getElementById('warmingup-kaart');
            const warmupTabel = document.getElementById('warmup-tabel');
            const schemaTitel = document.getElementById('schemaTitel');

            if (oneRM > 0) {
                let targetGewicht = oneRM;
                let percentageVan1RM = 100;

                if (doelType === "3") {
                    targetGewicht = oneRM / 1.10;
                    percentageVan1RM = 91;
                } else if (doelType === "5") {
                    targetGewicht = oneRM / 1.167;
                    percentageVan1RM = 86;
                } else if (doelType === "6") {
                    targetGewicht = oneRM / 1.20;
                    percentageVan1RM = 83;
                } else if (doelType === "8") {
                    targetGewicht = oneRM / 1.267;
                    percentageVan1RM = 79;
                }

                const opgemaaktDoelGewicht = formatGewicht(targetGewicht, isDumbbell);
                const opgemaakt1RM = formatGewicht(oneRM, isDumbbell);

                uitkomstDiv.style.display = 'block';
                warmupKaart.style.display = 'block';

                uitkomstDiv.innerHTML = `
                    Oefening: <strong style="color:var(--accent-color);">${oefening}</strong><br>
                    Basispunt (1RM of invoer): <strong>${opgemaakt1RM}</strong><br>
                    Doel ${doelType}RM (${percentageVan1RM}%): <strong>${opgemaaktDoelGewicht}</strong>
                `;

                schemaTitel.innerText = `Schema: ${oefening} (${opgemaaktDoelGewicht})`;

                let warmupSets = [];

                if (warmupStijl === "snel" && (doelType === "5" || doelType === "6" || doelType === "8")) {
                    warmupSets = [
                        { naam: "Set 1 (licht)", pct: 0.50, reps: "6" },
                        { naam: "Set 2 (prikkel)", pct: 0.75, reps: "3" },
                        { naam: `🔥 Werkset (${doelType}RM)`, pct: 1.00, reps: doelType, isWerkset: true }
                    ];
                } else {
                    if (doelType === "1") {
                        warmupSets = [
                            { naam: "Set 1 (zeer licht)", pct: 0.40, reps: "6" },
                            { naam: "Set 2 (licht)", pct: 0.55, reps: "5" },
                            { naam: "Set 3 (opbouw)", pct: 0.70, reps: "3" },
                            { naam: "Set 4 (zwaar)", pct: 0.85, reps: "2" },
                            { naam: "Set 5 (prikkel)", pct: 0.93, reps: "1" },
                            { naam: "🔥 Werkset (1RM)", pct: 1.00, reps: "1", isWerkset: true }
                        ];
                    } else if (doelType === "3") {
                        warmupSets = [
                            { naam: "Set 1 (licht)", pct: 0.50, reps: "8" },
                            { naam: "Set 2 (opbouw)", pct: 0.70, reps: "5" },
                            { naam: "Set 3 (zwaar)", pct: 0.82, reps: "3" },
                            { naam: "Set 4 (prikkel)", pct: 0.92, reps: "1" },
                            { naam: "🔥 Werkset (3RM)", pct: 1.00, reps: "3", isWerkset: true }
                        ];
                    } else if (doelType === "5" || doelType === "6" || doelType === "8") {
                        warmupSets = [
                            { naam: "Set 1 (licht)", pct: 0.45, reps: "8 - 10" },
                            { naam: "Set 2 (opbouw)", pct: 0.65, reps: "5" },
                            { naam: "Set 3 (zwaar)", pct: 0.80, reps: "3" },
                            { naam: "Set 4 (prikkel)", pct: 0.90, reps: "1" },
                            { naam: `🔥 Werkset (${doelType}RM)`, pct: 1.00, reps: doelType, isWerkset: true }
                        ];
                    }
                }

                warmupSets.unshift({ 
                    naam: "Opwarmen (techniek)", 
                    pct: 0, 
                    reps: "10 - 15", 
                    isLegeStang: true 
                });

                let html = "";
                warmupSets.forEach(set => {
                    let opgemaaktSetGewicht;
                    let rijKlasse = "";

                    if (set.isLegeStang) {
                        rijKlasse = 'class="techniekset"';
                        if (isDumbbell) {
                            opgemaaktSetGewicht = "Lichte dumbbells";
                        } else if (oefening === "Deadlift" || oefening === "Powerclean") {
                            opgemaaktSetGewicht = "40 - 60 kg (of licht)";
                        } else {
                            opgemaaktSetGewicht = "20 kg (lege stang)";
                        }
                    } else {
                        const berekendGewicht = targetGewicht * set.pct;
                        opgemaaktSetGewicht = formatGewicht(berekendGewicht, isDumbbell);
                        if (set.isWerkset) {
                            rijKlasse = 'class="werkset"';
                        }
                    }
                    
                    html += `
                        <tr ${rijKlasse}>
                            <td>${set.naam}</td>
                            <td><strong>${opgemaaktSetGewicht}</strong></td>
                            <td>${set.reps}</td>
                        </tr>
                    `;
                });

                warmupTabel.innerHTML = html;

            } else {
                uitkomstDiv.style.display = 'none';
                warmupKaart.style.display = 'none';
            }
        }
    </script>
</body>
</html>
