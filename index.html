<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IronBase 1RM & Warmup</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
            --accent-hover: #0284c7;
            --border-color: #334155;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            padding: 16px; 
            max-width: 450px; 
            margin: auto; 
            background-color: var(--bg-color);
            color: var(--text-color);
        }

        .welcome-header {
            text-align: center;
            padding: 20px 10px;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .welcome-header h1 {
            font-size: 1.5em;
            margin: 0;
            color: var(--accent-color);
        }

        .welcome-header p {
            font-size: 0.85em;
            color: #94a3b8;
            margin: 6px 0 0 0;
        }

        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        h2, h3 { margin-top: 0; color: #fff; }
        
        label { 
            display: block; 
            margin-top: 15px; 
            font-weight: 600; 
            font-size: 0.85em; 
            color: #cbd5e1;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input, select { 
            width: 100%; 
            padding: 12px; 
            margin-top: 6px; 
            border: 1px solid var(--border-color); 
            border-radius: 8px; 
            box-sizing: border-box; 
            font-size: 1em;
            background-color: #0f172a;
            color: #fff;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .resultaat { 
            background-color: #0c4a6e; 
            border-left: 4px solid var(--accent-color); 
            padding: 14px; 
            margin-top: 20px; 
            border-radius: 8px;
            font-size: 0.95em;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            text-align: left;
            padding: 12px 8px;
            border-bottom: 1px solid var(--border-color);
        }

        th { font-size: 0.75em; text-transform: uppercase; color: #94a3b8; }
        
        .werkset { 
            font-weight: bold; 
            background-color: rgba(56, 189, 248, 0.15); 
            color: var(--accent-color);
        }
    </style>
</head>
<body>

    <div class="welcome-header">
        <h1>🏋️‍♂️ IronBase</h1>
        <p id="begroeting">Klaar voor je volgende workout!</p>
    </div>

    <div class="card">
        <h2>1. Instellingen</h2>

        <label for="oefening">Kies Oefening:</label>
        <select id="oefening" onchange="laadGegevens(); updateStijlOpties();">
            <option value="Squat">🏋️ Squat</option>
            <option value="Bench Press">🏋️‍♂️ Bench Press (Barbell)</option>
            <option value="Dumbbell Press">🏋️‍♂️ Dumbbell Bench Press</option>
            <option value="Deadlift">⚡ Deadlift</option>
            <option value="Overhead Press">🎯 Overhead Press</option>
        </select>
